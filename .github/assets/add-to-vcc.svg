<svg xmlns="http://www.w3.org/2000/svg" width="270" height="62" viewBox="0 0 270 62" role="img" aria-labelledby="title description">
  <title id="title">Add Prefab Components to VCC</title>
  <desc id="description">A charcoal and orange button matching the Prefab Builder interface.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2a26"/>
      <stop offset="1" stop-color="#181715"/>
    </linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e400f"/>
      <stop offset="1" stop-color="#2e170d"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-30%" width="124%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="264" height="56" rx="9" fill="url(#surface)" stroke="#8f562e" stroke-width="1"/>
  <rect x="3" y="3" width="5" height="56" rx="2.5" fill="#ff8021"/>

  <g filter="url(#shadow)">
    <rect x="20" y="14" width="34" height="34" rx="7" fill="url(#action)" stroke="#ffa83d" stroke-opacity=".72"/>
  </g>
  <path d="M37 22v18M28 31h18" fill="none" stroke="#fbf2e3" stroke-width="3" stroke-linecap="round"/>

  <text x="69" y="29" fill="#fbf2e3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">ADD TO VCC</text>
  <text x="69" y="45" fill="#d5c7b5" font-family="Segoe UI, Arial, sans-serif" font-size="11">Prefab Components</text>
</svg>
