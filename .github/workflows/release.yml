name: Build Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated artifacts as a GitHub release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out package
        uses: actions/checkout@v6

      - name: Validate manifest and Unity metadata
        shell: pwsh
        run: ./.github/scripts/validate-package.ps1 -PackageRoot . -ExpectedName "com.wolfy527.prefab-components"

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          echo "name=$(jq -r '.name' package.json)" >> "$GITHUB_OUTPUT"
          echo "display_name=$(jq -r '.displayName' package.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Build VPM archive
        id: archive
        shell: bash
        run: |
          archive="${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip"
          archive_path="$RUNNER_TEMP/$archive"
          zip -r "$archive_path" . \
            -x ".git/*" ".github/*" ".vpm-listing/*" ".gitignore" ".gitattributes"
          sha256sum "$archive_path" > "$archive_path.sha256"
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$archive_path.sha256" >> "$GITHUB_OUTPUT"

      - name: Verify VPM archive
        shell: bash
        run: |
          sha256sum --check "${{ steps.archive.outputs.checksum_path }}"
          unzip -p "${{ steps.archive.outputs.path }}" package.json | jq -e '
            .name == "com.wolfy527.prefab-components" and
            .displayName == "Wolfy_527 - Prefab Components" and
            .version == "${{ steps.package.outputs.version }}"
          ' > /dev/null

      - name: Stage standalone Unity package
        shell: bash
        run: |
          package_root="Packages/${{ steps.package.outputs.name }}"
          mkdir -p "$package_root"
          rsync -a ./ "$package_root/" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".vpm-listing" \
            --exclude ".gitignore" \
            --exclude ".gitattributes" \
            --exclude "Packages"
          find "$package_root" -name '*.meta' -type f | sort > unitypackage-meta-list.txt

      - name: Build standalone Unity package
        shell: bash
        run: |
          output="$RUNNER_TEMP/Wolfy_527-Prefab-Components-${{ steps.package.outputs.version }}.unitypackage"
          staging="$RUNNER_TEMP/unitypackage"
          mkdir -p "$staging"

          while IFS= read -r meta; do
            guid="$(awk '/^guid: / { print $2; exit }' "$meta")"
            if [[ ! "$guid" =~ ^[0-9a-fA-F]{32}$ ]]; then
              echo "Invalid or missing GUID in $meta"
              exit 1
            fi

            asset="${meta%.meta}"
            entry="$staging/$guid"
            mkdir -p "$entry"
            cp "$meta" "$entry/asset.meta"
            printf '%s' "$asset" > "$entry/pathname"

            if [[ -f "$asset" ]]; then
              cp "$asset" "$entry/asset"
            fi
          done < unitypackage-meta-list.txt

          tar -czf "$output" -C "$staging" .
          test -s "$output"

      - name: Create GitHub release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.package.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increment package.json before publishing again."
            exit 1
          fi
          gh release create "$tag" \
            "${{ steps.archive.outputs.path }}" \
            "${{ steps.archive.outputs.checksum_path }}" \
            "${{ runner.temp }}/Wolfy_527-Prefab-Components-${{ steps.package.outputs.version }}.unitypackage" \
            package.json \
            --target "$GITHUB_SHA" \
            --title "${{ steps.package.outputs.display_name }} ${{ steps.package.outputs.version }}" \
            --notes-file CHANGELOG.md
