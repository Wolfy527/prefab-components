<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Wolfy_527 Prefab Components</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #17151c;
      color: #f6f1f8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(239, 141, 69, .16), transparent 34rem),
        radial-gradient(circle at 85% 85%, rgba(178, 91, 214, .14), transparent 34rem),
        #17151c;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 22px;
      background: rgba(35, 31, 42, .92);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }
    .eyebrow {
      color: #f3a66e;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .76rem;
    }
    h1 {
      margin: 10px 0 12px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.02;
      letter-spacing: -.04em;
    }
    p {
      margin: 0 0 28px;
      color: #ccc3d2;
      font-size: 1.05rem;
      line-height: 1.65;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ef8d45, #d76b4b);
      color: #201820;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(239, 141, 69, .22);
    }
    .note {
      margin-top: 18px;
      color: #93899b;
      font-size: .86rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Wolfy_527</div>
    <h1>Prefab Components</h1>
    <p>Reusable Unity authoring components for VRChat prefabs, including Live Mirroring and upload-safe authoring helpers.</p>
    <a class="button" href="vcc://vpm/addRepo?url=https%3A%2F%2Fwolfy527.github.io%2Fprefab-components%2Findex.json">Add to VCC</a>
    <div class="note">Requires VRChat Creator Companion on this computer.</div>
  </main>
</body>
</html>
